spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

spring.config.import=

server.port=8080
discord.webhook.url=http://localhost/dummy
spring.mail.host=localhost
spring.mail.username=dummy
spring.mail.password=dummy

# Tests drive deliveries directly, so the background worker must not interfere.
notifications.worker.enabled=false
notifications.delivery.max-attempts=3