<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da notificação</title>

    <!-- Bootstrap CSS Local -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">

            <!-- Cabeçalho e Ação de Retorno -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <h1 class="h2 text-dark fw-bold mb-0">Detalhes da notificação</h1>
                <a th:href="@{/notifications}" class="btn btn-outline-secondary btn-sm">
                    Voltar à lista
                </a>
            </div>

            <!-- Cartão: Dados Principais da Notificação -->
            <div class="card shadow-sm border-0 rounded-3 mb-4">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-sm-6 col-md-4">
                            <p class="mb-0 text-secondary small fw-semibold text-uppercase">ID</p>
                            <p class="fs-6 fw-bold text-dark mb-0" th:text="${notification.id}"></p>
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <p class="mb-0 text-secondary small fw-semibold text-uppercase">Tipo</p>
                            <p class="fs-6 text-dark mb-0" th:text="${notification.type}"></p>
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <p class="mb-0 text-secondary small fw-semibold text-uppercase">Estado</p>
                            <p class="fs-6 text-dark mb-0" th:text="${notification.status}"></p>
                        </div>
                        <div class="col-sm-6 col-md-6 border-top pt-3">
                            <p class="mb-0 text-secondary small fw-semibold text-uppercase">Data de criação</p>
                            <p class="fs-6 text-dark mb-0" th:text="${notification.formattedCreatedAt}"></p>
                        </div>

                        <div class="col-sm-6 col-md-6 border-top pt-3">
                            <p class="mb-0 text-secondary small fw-semibold text-uppercase">Data de envio</p>
                            <p class="fs-6 text-dark mb-0" th:text="${notification.formattedSentAt}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Secção: Detalhes do Email -->
            <section th:if="${emailNotification != null}">
                <div class="card shadow-sm border-0 rounded-3 mb-4">
                    <div class="card-header bg-white border-bottom py-3 px-4">
                        <h2 class="h5 fw-bold text-dark mb-0">Detalhes do email</h2>
                    </div>
                    <div class="card-body p-4">

                        <!-- Destinatários Principais -->
                        <div class="mb-3">
                            <p class="fw-semibold text-secondary mb-1">Para:</p>
                            <ul class="list-group list-group-flush border rounded-2">
                                <li class="list-group-item py-2 px-3"
                                    th:each="receiver : ${emailNotification.toReceivers}"
                                    th:text="${receiver}"></li>
                            </ul>
                        </div>

                        <!-- Destinatários CC -->
                        <div class="mb-3" th:if="${!#lists.isEmpty(emailNotification.ccReceivers)}">
                            <p class="fw-semibold text-secondary mb-1">CC:</p>
                            <ul class="list-group list-group-flush border rounded-2">
                                <li class="list-group-item py-2 px-3"
                                    th:each="receiver : ${emailNotification.ccReceivers}"
                                    th:text="${receiver}"></li>
                            </ul>
                        </div>

                        <!-- Destinatários BCC -->
                        <div class="mb-3" th:if="${!#lists.isEmpty(emailNotification.bccReceivers)}">
                            <p class="fw-semibold text-secondary mb-1">BCC:</p>
                            <ul class="list-group list-group-flush border rounded-2">
                                <li class="list-group-item py-2 px-3"
                                    th:each="receiver : ${emailNotification.bccReceivers}"
                                    th:text="${receiver}"></li>
                            </ul>
                        </div>

                        <!-- Assunto -->
                        <div class="mb-3 pb-2 border-bottom">
                            <p class="mb-1 fw-semibold text-secondary">Assunto:</p>
                            <p class="fs-6 text-dark fw-medium" th:text="${emailNotification.subject}"></p>
                        </div>

                        <!-- Conteúdo -->
                        <div>
                            <p class="fw-semibold text-secondary mb-2">Conteúdo:</p>
                            <pre class="bg-light p-3 border rounded-3 text-dark text-wrap font-monospace mb-0"
                                 style="max-height: 350px; overflow-y: auto;"
                                 th:text="${emailNotification.content}"></pre>
                        </div>

                    </div>
                </div>
            </section>

            <!-- Ação de Envio/Reenvio -->
            <div th:if="${notification.status.name() != 'SENT'}" class="d-flex align-items-center mb-3">
                <form th:action="@{/notifications/{id}/send(id=${notification.id})}" method="post">
                    <button type="submit"
                            class="btn btn-primary px-4 shadow-sm"
                            th:text="${notification.status.name() == 'FAILED' ? 'Reenviar email' : 'Enviar email'}">
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
