<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notification Details</title>

    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico(v=1)}" />

    <!-- Bootstrap CSS Local -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h1 class="h2 mb-0">Notification Details</h1>

        <a th:href="@{/notifications}"
           class="btn btn-outline-secondary">
            Back to List
        </a>
    </div>

    <!-- Notification information -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h2 class="h5 mb-0">General Information</h2>
        </div>

        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${notification.id}"></dd>

                <dt class="col-sm-3">Content</dt>
                <dd class="col-sm-9"
                    style="white-space: pre-wrap;"
                    th:text="${notification.content}"></dd>

                <dt class="col-sm-3">Created At</dt>
                <dd class="col-sm-9"
                    th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}"></dd>
            </dl>
        </div>
    </div>

    <!-- Deliveries -->
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h2 class="h5 mb-0">Deliveries</h2>
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(deliveries)}"
                 class="alert alert-info mb-0">
                This notification does not have any deliveries yet.
            </div>

            <div th:unless="${#lists.isEmpty(deliveries)}"
                 class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">Delivery ID</th>
                        <th scope="col">Mechanism</th>
                        <th scope="col">Status</th>
                        <th scope="col">Sent Time</th>
                        <th scope="col">Details</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="delivery : ${deliveries}">
                        <td th:text="${delivery.id}"></td>

                        <td th:text="${delivery.type}"></td>

                        <td>
        <span class="badge"
              th:classappend="${delivery.status.name() == 'SENT'} ? ' text-bg-success' :
                              (${delivery.status.name() == 'FAILED'} ? ' text-bg-danger' : ' text-bg-warning')"
              th:text="${delivery.status}">
        </span>
                        </td>

                        <td th:text="${delivery.sentAt != null ? #temporals.format(delivery.sentAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>

                        <td>
                            <button type="button"
                                    th:if="${delivery.type.name() == 'EMAIL'}"
                                    class="btn btn-outline-primary btn-sm"
                                    th:attr="data-delivery-id=${delivery.id}"
                                    onclick="showEmailDetails(this.dataset.deliveryId)">
                                View Details
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

</div>

<!-- Email details modal -->
<div class="modal fade"
     id="emailDetailsModal"
     tabindex="-1"
     aria-labelledby="emailDetailsModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title fs-5" id="emailDetailsModalLabel">
                    Email Details
                </h2>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <strong>Subject</strong>
                    <p id="emailSubject" class="mb-0"></p>
                </div>

                <hr>

                <div class="mb-3">
                    <strong>Recipients</strong>
                    <ul id="emailRecipients" class="list-group mt-2"></ul>
                </div>

                <hr>

                <div>
                    <strong>Content</strong>
                    <p id="emailContent"
                       class="border rounded bg-light p-3 mt-2 mb-0"
                       style="white-space: pre-wrap;"></p>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    async function showEmailDetails(deliveryId) {
        try {
            const response = await fetch(`/deliveries/${deliveryId}/details`);

            if (!response.ok) {
                alert("Could not load the email details.");
                return;
            }

            const email = await response.json();

            document.getElementById("emailSubject").textContent =
                email.subject ?? "(No subject)";

            document.getElementById("emailContent").textContent =
                email.content ?? "";

            const recipientsList = document.getElementById("emailRecipients");
            recipientsList.replaceChildren();

            for (const recipient of (email.recipients ?? [])) {
                const item = document.createElement("li");
                item.className = "list-group-item";

                const type = document.createElement("span");
                type.className = "badge text-bg-secondary me-2";
                type.textContent = recipient.recipientType;

                const address = document.createElement("span");
                address.textContent = recipient.emailAddress;

                item.append(type, address);
                recipientsList.appendChild(item);
            }

            bootstrap.Modal.getOrCreateInstance(
                document.getElementById("emailDetailsModal")
            ).show();

        } catch (error) {
            alert("An error occurred while loading the email details.");
            console.error(error);
        }
    }
</script>

</body>
</html>
