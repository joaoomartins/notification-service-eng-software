<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações</title>

    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico(v=1)}" />

    <!-- Bootstrap CSS Local -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container py-5">

    <!-- Mensagens de Feedback Flash (Sucesso ou Erro) -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show shadow-sm auto-dismiss mb-4"
         role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show shadow-sm auto-dismiss mb-4"
         role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Cabeçalho e Ação Principal -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h1 class="h2 text-dark fw-bold mb-0">Notificações</h1>
        <a th:href="@{/notifications/new}" class="btn btn-primary d-inline-flex align-items-center shadow-sm">
            Criar notificação
        </a>
    </div>

    <!-- Barra de Filtros / Seletor de Itens por Página -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="text-muted small">
            <span th:if="${notificationPage.totalElements > 0}">
                A mostrar <strong th:text="${notificationPage.number * notificationPage.size + 1}">1</strong> a
                <strong th:text="${(notificationPage.number + 1) * notificationPage.size > notificationPage.totalElements ? notificationPage.totalElements : (notificationPage.number + 1) * notificationPage.size}">5</strong>
                de <strong th:text="${notificationPage.totalElements}">20</strong> notificações
            </span>
        </div>

        <form method="get" th:action="@{/notifications}" class="d-flex align-items-center gap-2">
            <input type="hidden" name="page" value="0">
            <label for="sizeSelect" class="form-label small text-secondary mb-0 text-nowrap">Por página:</label>
            <select id="sizeSelect" name="size" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                <option th:value="5" th:text="'5'" th:selected="${pageSize == 5}"></option>
                <option th:value="10" th:text="'10'" th:selected="${pageSize == 10}"></option>
                <option th:value="20" th:text="'20'" th:selected="${pageSize == 20}"></option>
                <option th:value="50" th:text="'50'" th:selected="${pageSize == 50}"></option>
            </select>
        </form>
    </div>

    <!-- Cartão com a Tabela -->
    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light border-bottom">
                <tr>
                    <th scope="col" class="py-3 px-4 text-secondary text-uppercase fw-semibold" style="font-size: 0.8rem;">ID</th>
                    <th scope="col" class="py-3 px-4 text-secondary text-uppercase fw-semibold" style="font-size: 0.8rem;">Tipo</th>
                    <th scope="col" class="py-3 px-4 text-secondary text-uppercase fw-semibold" style="font-size: 0.8rem;">Estado</th>
                    <th scope="col" class="py-3 px-4 text-secondary text-uppercase fw-semibold" style="font-size: 0.8rem;">Data de criação</th>
                    <th scope="col" class="py-3 px-4 text-secondary text-uppercase fw-semibold text-end" style="font-size: 0.8rem;">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="notification : ${notificationPage.content}">
                    <td class="py-3 px-4 fw-medium text-dark" th:text="${notification.id}"></td>
                    <td class="py-3 px-4" th:text="${notification.type}"></td>

                    <!-- Estado com Badge Colorido -->
                    <td class="py-3 px-4">
                        <span class="badge rounded-pill px-3 py-2 fw-semibold"
                              th:text="${notification.status}"
                              th:classappend="${notification.status.name() == 'SENT'} ? 'bg-success text-white' :
                                             (${notification.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                             (${notification.status.name() == 'FAILED'} ? 'bg-danger text-white' : 'bg-secondary text-white'))">
                        </span>
                    </td>

                    <td class="py-3 px-4 text-muted" th:text="${notification.formattedCreatedAt}"></td>
                    <td class="py-3 px-4 text-end">
                        <a th:href="@{/notifications/{id}(id=${notification.id})}" class="btn btn-sm btn-outline-primary">
                            Ver detalhes
                        </a>
                    </td>
                </tr>
                <tr th:if="${notificationPage.isEmpty()}">
                    <td colspan="5" class="py-5 text-center text-muted fst-italic">
                        Ainda não existem notificações.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Rodapé do Cartão com a Paginação -->
        <div th:if="${notificationPage.totalPages > 1}" class="card-footer bg-white border-top py-3 d-flex justify-content-center">
            <nav aria-label="Navegação da tabela">
                <ul class="pagination mb-0">

                    <!-- Botão Anterior -->
                    <li class="page-item" th:classappend="${notificationPage.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/notifications(page=${currentPage - 1}, size=${pageSize})}"
                           aria-label="Anterior">
                            &laquo; Anterior
                        </a>
                    </li>

                    <!-- Números das Páginas -->
                    <li class="page-item"
                        th:each="pageNumber : ${#numbers.sequence(0, notificationPage.totalPages - 1)}"
                        th:classappend="${pageNumber == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/notifications(page=${pageNumber}, size=${pageSize})}"
                           th:text="${pageNumber + 1}">
                            1
                        </a>
                    </li>

                    <!-- Botão Seguinte -->
                    <li class="page-item" th:classappend="${notificationPage.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/notifications(page=${currentPage + 1}, size=${pageSize})}"
                           aria-label="Seguinte">
                            Seguinte &raquo;
                        </a>
                    </li>

                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- Script para fechar o alerta sozinho após 4 segundos -->
<script>
    setTimeout(() => {
        const alerts = document.querySelectorAll('.auto-dismiss');
        alerts.forEach(alert => {
            alert.classList.remove('show');
            setTimeout(() => alert.remove(), 300);
        });
    }, 4000);
</script>

</body>
</html>
