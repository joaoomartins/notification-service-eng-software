<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications</title>

    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico(v=1)}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- Page header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">Notifications</h1>

        <a th:href="@{/notifications/new}" class="btn btn-primary">
            Create Notification
        </a>
    </div>

    <!-- Total notifications and page size -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <div class="text-muted small">
            <span th:if="${notificationPage.totalElements > 0}">
                Existem
                <strong th:text="${notificationPage.totalElements}">18</strong>
                notificações
            </span>
        </div>

        <form method="get"
              th:action="@{/notifications}"
              class="d-flex align-items-center gap-2">

            <input type="hidden" name="page" value="0">

            <label for="sizeSelect"
                   class="form-label small text-secondary mb-0 text-nowrap">
                Por página:
            </label>

            <select id="sizeSelect"
                    name="size"
                    class="form-select form-select-sm"
                    style="width: auto;"
                    onchange="this.form.submit()">

                <option value="5"
                        th:selected="${pageSize == 5}">
                    5
                </option>

                <option value="10"
                        th:selected="${pageSize == 10}">
                    10
                </option>

                <option value="20"
                        th:selected="${pageSize == 20}">
                    20
                </option>

                <option value="50"
                        th:selected="${pageSize == 50}">
                    50
                </option>
            </select>
        </form>
    </div>

    <!-- Empty state -->
    <div th:if="${notificationPage.numberOfElements == 0}"
         class="alert alert-info"
         role="alert">
        No notifications available yet.
    </div>

    <!-- Notifications table -->
    <div th:if="${notificationPage.numberOfElements > 0}"
         class="card shadow-sm">

        <div class="card-header bg-white">
            <h2 class="h5 mb-0">All Notifications</h2>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">

                <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Subject</th>
                    <th scope="col">Created At</th>
                    <th scope="col" class="text-center">Details</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="notification : ${notificationPage.content}">

                    <td th:text="${notification.id}">1</td>

                    <td th:text="${@notificationService.findEmailSubjectByNotificationId(notification.id)}">
                        Example subject
                    </td>

                    <td th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}">
                        28/10/2026 12:00
                    </td>

                    <td class="text-center">
                        <a th:href="@{/notifications/{id}(id=${notification.id})}"
                           class="btn btn-outline-primary btn-sm">
                            View Details
                        </a>
                    </td>

                </tr>
                </tbody>

            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${notificationPage.totalPages > 1}"
         aria-label="Pagination"
         class="mt-4">

        <ul class="pagination justify-content-center">

            <!-- Previous page -->
            <li class="page-item"
                th:classappend="${notificationPage.first} ? 'disabled'">

                <a class="page-link"
                   th:if="${!notificationPage.first}"
                   th:href="@{/notifications(page=${currentPage - 1}, size=${pageSize})}">
                    Previous
                </a>

                <span class="page-link"
                      th:if="${notificationPage.first}">
                    Previous
                </span>
            </li>

            <!-- Page numbers -->
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, notificationPage.totalPages - 1)}"
                th:classappend="${pageNumber == currentPage} ? 'active'">

                <a class="page-link"
                   th:href="@{/notifications(page=${pageNumber}, size=${pageSize})}"
                   th:text="${pageNumber + 1}">
                    1
                </a>
            </li>

            <!-- Next page -->
            <li class="page-item"
                th:classappend="${notificationPage.last} ? 'disabled'">

                <a class="page-link"
                   th:if="${!notificationPage.last}"
                   th:href="@{/notifications(page=${currentPage + 1}, size=${pageSize})}">
                    Next
                </a>

                <span class="page-link"
                      th:if="${notificationPage.last}">
                    Next
                </span>
            </li>

        </ul>
    </nav>

</div>

</body>
</html>
