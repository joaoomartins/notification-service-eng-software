<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova notificação</title>

    <!-- Bootstrap CSS Local -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <!-- Cabeçalho -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <h1 class="h2 text-dark fw-bold mb-0">Nova notificação</h1>
                <a th:href="@{/notifications}" class="btn btn-outline-secondary btn-sm">
                    Voltar à lista
                </a>
            </div>

            <!-- Cartão do Formulário -->
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">

                    <form method="post" th:object="${request}">

                        <!-- Mecanismo de Entrega -->
                        <div class="mb-4">
                            <label for="mechanism" class="form-label fw-semibold text-secondary">
                                Mecanismo de entrega:
                            </label>
                            <select id="mechanism" class="form-select" onchange="changeMechanism()">
                                <option value="EMAIL">Email</option>
                            </select>
                        </div>

                        <p>From: <span thDynamic th:text="${@environment.getProperty('MAIL_USERNAME')}"></span></p>

                        <!-- Secção de Campos de Email -->
                        <div id="emailFields">
                            <div class="mb-3">
                                <label for="toReceivers" class="form-label fw-semibold text-secondary">
                                    Destinatários (obrigatório):
                                </label>
                                <input type="text"
                                       id="toReceivers"
                                       class="form-control"
                                       th:field="*{toReceivers}"
                                       placeholder="exemplo@email.com, outro@email.com"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="ccReceivers" class="form-label fw-semibold text-secondary">
                                    CC:
                                </label>
                                <input type="text"
                                       id="ccReceivers"
                                       class="form-control"
                                       th:field="*{ccReceivers}"
                                       placeholder="Destinatários em CC, separados por vírgulas">
                            </div>

                            <div class="mb-3">
                                <label for="bccReceivers" class="form-label fw-semibold text-secondary">
                                    BCC:
                                </label>
                                <input type="text"
                                       id="bccReceivers"
                                       class="form-control"
                                       th:field="*{bccReceivers}"
                                       placeholder="Destinatários em BCC, separados por vírgulas">
                            </div>

                            <div class="mb-3">
                                <label for="subject" class="form-label fw-semibold text-secondary">
                                    Assunto:
                                </label>
                                <input type="text"
                                       id="subject"
                                       class="form-control"
                                       th:field="*{subject}"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label for="content" class="form-label fw-semibold text-secondary">
                                    Conteúdo:
                                </label>
                                <textarea id="content"
                                          class="form-control"
                                          th:field="*{content}"
                                          rows="8"
                                          required></textarea>
                            </div>
                        </div>

                        <!-- Botões de Ação -->
                        <div class="d-flex flex-wrap gap-2 pt-2 border-top">
                            <button type="submit"
                                    class="btn btn-secondary px-4 shadow-sm"
                                    th:formaction="@{/notifications/save}">
                                Guardar
                            </button>

                            <button type="submit"
                                    class="btn btn-primary px-4 shadow-sm"
                                    th:formaction="@{/notifications/send}">
                                Guardar e enviar
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function changeMechanism() {
        const mechanism = document.getElementById("mechanism").value;

        document.getElementById("emailFields").hidden =
            mechanism !== "EMAIL";
    }
</script>
</body>
</html>
