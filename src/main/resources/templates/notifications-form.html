
<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Notification</title>

    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico(v=1)}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="mb-4">
                <h1 class="h2">Create an Email Notification</h1>
                <p class="text-secondary mb-0">
                    Fill in the email details. The notification will be processed automatically.
                </p>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/notifications}" method="post">

                        <div class="mb-3">
                            <label for="to" class="form-label">
                                TO Recipients <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="to"
                                   name="to"
                                   required
                                   placeholder="email1@exemplo.pt, email2@exemplo.pt">
                            <div class="form-text">
                                Required. Separate multiple email addresses with commas.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="cc" class="form-label">CC Recipients</label>
                            <input type="text"
                                   class="form-control"
                                   id="cc"
                                   name="cc"
                                   placeholder="email3@exemplo.pt, email4@exemplo.pt">
                        </div>

                        <div class="mb-3">
                            <label for="bcc" class="form-label">BCC Recipients</label>
                            <input type="text"
                                   class="form-control"
                                   id="bcc"
                                   name="bcc"
                                   placeholder="email5@exemplo.pt">
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label">
                                Subject <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="subject"
                                   name="subject"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="priority" class="form-label">Priority</label>
                            <select class="form-select" id="priority" name="priority" required>
                                <option th:each="p : ${priorities}"
                                        th:value="${p}"
                                        th:text="${p}"
                                        th:selected="${p.name() == 'NORMAL'}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">
                                Content <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control"
                                      id="content"
                                      name="content"
                                      required
                                      rows="6"
                                      placeholder="Write your notification here..."></textarea>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary">
                                Create Notification
                            </button>

                            <a th:href="@{/notifications}"
                               class="btn btn-outline-secondary ms-sm-auto">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
